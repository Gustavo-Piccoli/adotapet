services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-Your_strong_password123}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/AdotaPet.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=AdotaPet;User Id=sa;Password=${SA_PASSWORD:-Your_strong_password123};TrustServerCertificate=True"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev-only-signing-key-change-me-0123456789abcdef}
      Storage__PhotosPath: /data/photos
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - photos:/data/photos
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      # Kestrel only listens after migrations and seed finish; aspnet has bash but no curl
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  web:
    build:
      context: web
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqldata:
  photos:
